<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b6f3f">
    <meta name="description" content="Professional well pump services in Apple Valley, CA. Contact K.D. Gower Well Services.">
    <title>K.D. Gower Well Services</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f8f8;
            color: #1a1a1a;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 2.5rem);
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.2s, transform 0.2s;
            display: inline-block;
        }

        .primary {
            background: #1b6f3f;
            color: #fff;
        }

        .primary:hover {
            background: #165e35;
            transform: translateY(-2px);
        }

        .secondary {
            border: 2px solid #1b6f3f;
            color: #1b6f3f;
        }

        .secondary:hover {
            background: #eaf2ed;
            transform: translateY(-2px);
        }

        .app-link {
            background: #1a1a1a;
            color: #fff;
        }

        .app-link:hover {
            background: #333;
            transform: translateY(-2px);
        }

        a:focus-visible {
            outline: 3px solid #1b6f3f;
            outline-offset: 4px;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #888;
        }

        footer a {
            padding: 0;
            font-size: inherit;
            color: inherit;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .cta-buttons {
                flex-direction: column;
            }

            .cta-buttons a {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>K.D. Gower Well Services</h1>

        <p>
            Professional well pump services in Apple Valley, CA.
            Reliable service for your well water needs.
        </p>

        <div class="cta-buttons">
            <a href="tel:+1234567890" class="primary">
                Call Now
            </a>

            <a
                href="https://k-d-gower-well-services-0hm4.vercel.app/"
                class="app-link"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open Web App
            </a>

            <a
                href="https://your-main-site.com"
                class="secondary"
            >
                Visit Main Site
            </a>
        </div>

        <footer>
            &copy; <span id="year"></span> K.D. Gower Well Services
        </footer>
    </main>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>
</body>
</html>
